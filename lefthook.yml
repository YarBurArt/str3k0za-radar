pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.go"
      run: gofumpt -l -w {staged_files}
      stage_fixed: true

    lint:
      glob: "*.go"
      run: golangci-lint run ./...

    secrets:
      run: gitleaks protect --staged --no-banner -v

pre-push:
  parallel: true
  commands:
    test:
      run: go test ./...
