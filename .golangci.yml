run:
  timeout: 3m
  go: "1.26"

linters:
  enable:
    - gofumpt
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - prealloc
    - exhaustive

linters-settings:
  gosec:
    excludes:
      - G104  # unresolved errors of defer
  revive:
    rules:
      - name: exported
        disabled: true  # exported func comments soft

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
